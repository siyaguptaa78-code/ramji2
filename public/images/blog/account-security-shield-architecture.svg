<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0c0806"/>
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="#18110b" stroke="#332115"/>
  <text x="80" y="90" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#f59e0b">RAMJI247 ID • SECURITY &amp; COMPLIANCE</text>
  <text x="80" y="130" font-family="'Montserrat', sans-serif" font-weight="800" font-size="34" fill="#ffffff">Multi-Layer Digital Account Defense Architecture</text>
  <text x="80" y="160" font-family="'Poppins', sans-serif" font-size="16" fill="#a8a29e">Industry-standard authentication, encrypted session tokens, and threat mitigation.</text>

  <!-- Layer 1 -->
  <rect x="80" y="200" width="330" height="340" rx="10" fill="#241a12" stroke="#d97706"/>
  <rect x="100" y="220" width="120" height="28" rx="6" fill="#d97706"/>
  <text x="110" y="239" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#ffffff">LAYER 1: ACCESS</text>
  <text x="100" y="280" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#ffffff">Biometrics &amp; 2FA (TOTP)</text>
  <text x="100" y="310" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Time-based one-time passcodes</text>
  <text x="100" y="340" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• High-entropy salted SHA-256 keys</text>
  <text x="100" y="370" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Brute-force rate-limiting triggers</text>
  <text x="100" y="420" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#fbbf24">Neutralizes 99.8% of credential stuffing</text>

  <!-- Layer 2 -->
  <rect x="435" y="200" width="330" height="340" rx="10" fill="#241a12" stroke="#f59e0b"/>
  <rect x="455" y="220" width="130" height="28" rx="6" fill="#f59e0b"/>
  <text x="465" y="239" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#000000">LAYER 2: TRANSIT</text>
  <text x="455" y="280" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#ffffff">TLS 1.3 &amp; AES-256 GCM</text>
  <text x="455" y="310" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• End-to-end encrypted payloads</text>
  <text x="455" y="340" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Strict HSTS preloading headers</text>
  <text x="455" y="370" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Man-in-the-middle packet immunity</text>
  <text x="455" y="420" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#fbbf24">Banking-grade cryptographic standards</text>

  <!-- Layer 3 -->
  <rect x="790" y="200" width="330" height="340" rx="10" fill="#241a12" stroke="#10b981"/>
  <rect x="810" y="220" width="140" height="28" rx="6" fill="#10b981"/>
  <text x="820" y="239" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#ffffff">LAYER 3: SESSION</text>
  <text x="810" y="280" font-family="'Poppins', sans-serif" font-weight="700" font-size="16" fill="#ffffff">Automated Anomaly Watch</text>
  <text x="810" y="310" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Geolocation mismatch detection</text>
  <text x="810" y="340" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Immediate session revocation</text>
  <text x="810" y="370" font-family="'Poppins', sans-serif" font-size="14" fill="#d6d3d1">• Inactive auto-logout after 15 mins</text>
  <text x="810" y="420" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#34d399">Instant automated lockdown alerts</text>
</svg>